<html lang="ar" dir="rtl"><head><meta charset="utf-8">

<title>كتب رواق</title>
<style>
:root{--bg:#EDE3D1;--ink:#3a2f26;--card:#f6efe2;--shadow:rgba(60,40,20,.22)}
@media (prefers-color-scheme: dark){:root{--bg:#1d1814;--ink:#efe4d2;--card:#2a231d;--shadow:rgba(0,0,0,.5)}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"GE SS Two","Segoe UI",Tahoma,sans-serif;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;gap:28px;padding:40px max(16px,env(safe-area-inset-left,0px))}
header{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
header img{height:44px} @media (prefers-color-scheme: dark){header img{filter:invert(1) brightness(.92)}}
h1{font-size:22px} p{opacity:.7;font-size:14px}
.shelf{display:flex;flex-wrap:wrap;gap:22px;justify-content:center}
a.book{display:flex;flex-direction:column;gap:10px;width:200px;color:inherit;text-decoration:none}
a.book img{width:100%;border-radius:3px 6px 6px 3px;box-shadow:0 14px 30px var(--shadow);transition:transform .25s}
a.book:hover img{transform:translateY(-4px) rotate(-1deg)}
a.book span{font-weight:700;font-size:15px;text-align:center}
</style></head><body>
